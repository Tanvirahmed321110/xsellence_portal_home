<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Modal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f0f0f;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== Trigger Button ===== */
        .delete-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 65, 108, 0.4);
            transition: all 0.2s;
        }

        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.5);
        }

        /* ===== Overlay — full screen ===== */
        #modal-1.modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        #modal-1.modal-overlay.active {
            display: flex;
        }

        /* ===== Container ===== */
        #modal-1.modal-overlay .modal-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 36px 30px;
            text-align: center;
            width: 320px;
            position: relative;
            z-index: 1;
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ===== Icon ===== */
        #modal-1.modal-overlay .modal-container .glass-icon {
            width: 56px;
            height: 56px;
            background: rgba(255, 65, 108, 0.2);
            border: 1px solid rgba(255, 65, 108, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 24px;
        }

        /* ===== Title ===== */
        #modal-1.modal-overlay .modal-container h3 {
            font-family: 'Syne', sans-serif;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* ===== Description ===== */
        #modal-1.modal-overlay .modal-container p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        /* ===== Actions ===== */
        #modal-1.modal-overlay .modal-container .glass-actions {
            display: flex;
            gap: 10px;
        }

        /* ===== Yes Button ===== */
        #modal-1.modal-overlay .modal-container .glass-actions .btn-glass-yes {
            flex: 1;
            padding: 11px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        #modal-1.modal-overlay .modal-container .glass-actions .btn-glass-yes:hover {
            opacity: 0.85;
            transform: scale(0.97);
        }

        /* ===== No Button ===== */
        #modal-1.modal-overlay .modal-container .glass-actions .btn-glass-no {
            flex: 1;
            padding: 11px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #modal-1.modal-overlay .modal-container .glass-actions .btn-glass-no:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        /* ===== Animations ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- Trigger Button -->
    <button class="delete-btn" onclick="openModal()">🗑 Delete Task</button>

    <!-- ===== Delete Modal ===== -->
    <div id="modal-1" class="modal-overlay">
        <div class="modal-container">
            <div class="glass-icon">🗑️</div>
            <h3>Delete Task?</h3>
            <p>
                This action cannot be undone.<br>
                The task will be permanently removed.
            </p>

            <div class="glass-actions">
                <button class="btn-glass-yes">
                    Yes, Delete
                </button>
                <button class="btn-glass-no" onclick="closeModal()">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        // Modal খোলা
        function openModal() {
            document.getElementById('modal-1').classList.add('active');
        }

        // Modal বন্ধ করা
        function closeModal() {
            document.getElementById('modal-1').classList.remove('active');
        }

        // Container এর বাইরে click করলে বন্ধ হবে
        document.getElementById('modal-1').addEventListener('click', function (e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>

</body>

</html>
