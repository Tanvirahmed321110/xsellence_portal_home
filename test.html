<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>View Toggle</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Segoe UI', sans-serif;
                background: #f5f5f7;
                min-height: 100vh;
                padding: 32px 24px;
            }

            :root {
                --color-primary: #d9117b;
            }


            .toggle-group {
                display: flex;
                gap: 8px;
                background: #fff;
                border: 1.5px solid #e0e0e0;
                border-radius: 10px;
                padding: 4px;
            }

            /*============ Toggle Buttons ========*/
            .toggle-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                border: none;
                border-radius: 6px;
                background: transparent;
                color: #999;
                cursor: pointer;
                transition: background 0.2s ease, color 0.2s ease, transform 0.1s ease;
            }

            .toggle-btn:hover {
                background: var(--color-primary);
                color: #fff;
            }

            .toggle-btn.active {
                background: var(--color-primary);
                color: #fff;
            }

            .toggle-btn:active {
                transform: scale(0.92);
                background: var(--color-primary);
                color: #fff;
            }

            /*============  Content Panels  ==========*/
            .view-panel {
                display: none;
            }

            .view-panel.visible {
                display: block;
            }

        </style>
    </head>

    <body>


            <div class="toggle-group">
                <!-- List View Button -->
                <button class="toggle-btn" id="btn-list" title="List View" onclick="setView('list')">
                    <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
                        <rect x="1" y="2" width="16" height="2.5" rx="1.25" fill="currentColor" />
                        <rect x="1" y="7.75" width="16" height="2.5" rx="1.25" fill="currentColor" />
                        <rect x="1" y="13.5" width="16" height="2.5" rx="1.25" fill="currentColor" />
                    </svg>
                </button>
                <!-- Grid View Button -->
                <button class="toggle-btn active" id="btn-grid" title="Grid View" onclick="setView('grid')">
                    <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
                        <rect x="1" y="1" width="7" height="7" rx="1.5" fill="currentColor" />
                        <rect x="10" y="1" width="7" height="7" rx="1.5" fill="currentColor" />
                        <rect x="1" y="10" width="7" height="7" rx="1.5" fill="currentColor" />
                        <rect x="10" y="10" width="7" height="7" rx="1.5" fill="currentColor" />
                    </svg>
                </button>
            </div>

        <!-- Grid View Panel -->
        <div class="view-panel visible" id="panel-grid">
            <div class="grid-view">
                <div>grid view</div>
            </div>
        </div>

        <!-- List View Panel -->
        <div class="view-panel" id="panel-list">
            <div class="list-view">
                <div>list view</div>
            </div>
        </div>

        <script>
            function setView(type) {
                // Panels
                document.getElementById('panel-grid').classList.toggle('visible', type === 'grid');
                document.getElementById('panel-list').classList.toggle('visible', type === 'list');

                // Buttons
                document.getElementById('btn-grid').classList.toggle('active', type === 'grid');
                document.getElementById('btn-list').classList.toggle('active', type === 'list');
            }
        </script>

    </body>

</html>
